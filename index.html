<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4b5320">
<title>Ranking</title>
<style>
:root{--bg:#4b5320;--bg2:#3c4219;--card:rgba(0,0,0,.22);--line:rgba(255,255,255,.14);--txt:#f4f1e4;--mut:#c9c6ad;--acc:#e3cf7a;--ouro:#facc15;--prata:#e2e8f0;--bronze:#d97706;--ok:#4ade80;--erro:#f87171}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;height:100vh;height:100dvh;overflow:hidden;background:radial-gradient(ellipse at top,var(--bg) 0%,var(--bg2) 100%);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:1.2rem 1rem .6rem;height:100%;display:flex;flex-direction:column}
.wrap>header,.aovivo,#procura,footer{flex-shrink:0}
/* só a lista de atletas faz scroll */
.lista{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
header{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1rem}
.titulo{min-width:0}
.marca{font-size:.75rem;letter-spacing:.2em;color:var(--acc);font-weight:800}
h1{margin:0;font-size:clamp(1.25rem,3.6vw,2.1rem);line-height:1.15;text-wrap:balance}
.lema{margin:.35rem 0 .55rem;font-size:clamp(1rem,2.6vw,1.45rem);font-style:italic;font-weight:600;color:var(--acc)}
.info{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1rem}
.lado{display:flex;align-items:center;gap:.7rem;flex-shrink:0}
.logo{display:flex}
.logo img{height:clamp(78px,15vw,140px);width:auto;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
#btnEcra{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
#btnEcra:hover{background:rgba(0,0,0,.35)}
#btnEcra svg{width:22px;height:22px}
#btnEcra[hidden]{display:none}
.vivo{display:flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--mut);white-space:nowrap}
/* Ecrã inteiro: modo TV */
body.ecra .wrap{max-width:none;padding:2vh 3vw}
body.ecra #procura{display:none}
body.ecra h1{font-size:clamp(1.8rem,3.2vw,3.2rem)}
body.ecra .lema{font-size:clamp(1.3rem,2.2vw,2.2rem)}
body.ecra .marca{font-size:clamp(.8rem,1.1vw,1.1rem)}
body.ecra .logo img{height:clamp(110px,16vh,210px)}
body.ecra td{font-size:clamp(1.3rem,2.6vw,2.6rem);padding:1.1vh .8vw}
body.ecra th{font-size:clamp(.8rem,1.2vw,1.2rem)}
body.ecra .pos span{width:2.4em;height:2.4em;font-size:.8em}
body.ecra .vc-nome{font-size:clamp(1.5rem,2.4vw,2.6rem)}
body.ecra .vc-tempo{font-size:clamp(3rem,5.5vw,6rem)}
body.ecra .vc-topo{font-size:clamp(.8rem,1.1vw,1.1rem)}
body.ecra .vc-pos{font-size:clamp(1rem,1.4vw,1.5rem)}
body.ecra .aovivo-vazio{font-size:clamp(1rem,1.4vw,1.4rem)}
.ponto{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulso 2s infinite}
.vivo.off .ponto{background:var(--erro);animation:none}
@keyframes pulso{70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
/* Em prova (tempo real) */
.aovivo{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.8rem;margin-bottom:1rem}
.vivo-card{background:rgba(0,0,0,.3);border:1px solid var(--line);border-left:6px solid var(--cor);border-radius:14px;padding:.8rem 1rem}
.vivo-card[data-p=A]{--cor:#22d3ee}.vivo-card[data-p=B]{--cor:#f59e0b}
.vc-topo{display:flex;align-items:center;gap:.5rem;font-size:.72rem;font-weight:800;letter-spacing:.12em;color:var(--cor)}
.vc-topo .rec{width:9px;height:9px;border-radius:50%;background:#ef4444;animation:piscar 1s infinite}
.vivo-card.parado .rec{background:var(--acc);animation:none}
@keyframes piscar{50%{opacity:.25}}
.vc-nome{font-size:clamp(1.15rem,3vw,1.6rem);font-weight:700;margin:.3rem 0 .15rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vc-tempo{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(2.2rem,8vw,3.4rem);line-height:1.05;color:#fff}
.vivo-card.parado .vc-tempo{color:var(--acc)}
.vc-pos{font-size:.85rem;color:var(--mut);margin-top:.25rem;min-height:1.2em}
.vc-pos b{color:var(--txt)}
.aovivo-vazio{color:var(--mut);font-size:.9rem;border:1px dashed var(--line);border-radius:12px;padding:.7rem 1rem;text-align:center}
#procura{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:.7rem .9rem;font-size:1rem;margin-bottom:.8rem;font-family:inherit}
table{width:100%;border-collapse:collapse}
th{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1;background:#3f4619}
td{padding:.75rem .6rem;border-bottom:1px solid var(--line);font-size:clamp(1rem,2.6vw,1.35rem)}
.num{text-align:right;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{width:3.2rem}
.pos span{display:inline-flex;align-items:center;justify-content:center;width:2.1rem;height:2.1rem;border-radius:50%;background:var(--card);font-weight:800;font-size:.95rem}
tr.p1 .pos span{background:var(--ouro);color:#111}
tr.p2 .pos span{background:var(--prata);color:#111}
tr.p3 .pos span{background:var(--bronze);color:#111}
.nome{font-weight:600;word-break:break-word}
.dif{color:var(--mut);font-size:.9em}
.tent{color:var(--mut);font-size:.85em}
tr.novo td{animation:brilho 3s ease-out}
#procura::placeholder{color:var(--mut)}
@keyframes brilho{0%{background:rgba(227,207,122,.45)}100%{background:transparent}}
#vazio{color:var(--mut);text-align:center;padding:2rem 0}
footer{margin-top:.6rem;color:var(--mut);font-size:.75rem;text-align:center}
@media (max-width:480px){.col-tent{display:none}}
</style>
</head>

  <section class="aovivo" id="aoVivo"></section>
  <input id="procura" type="search" placeholder="Procurar atleta…" autocomplete="off">

  <div class="lista">
  <table>
    <thead><tr><th class="pos">#</th><th>Atleta</th><th class="num">Tempo</th><th class="num">Dif.</th><th class="num col-tent">Tent.</th></tr></thead>
    <tbody id="corpo"></tbody>
  </table>
  <p id="vazio" hidden>Ainda não há tempos registados.</p>
  </div>

  <footer>Melhor tempo de cada atleta · mais rápido = melhor · atualizado às <span id="hora">—</span></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="comum.js"></script>
<script>
const C = Crono, $ = id => document.getElementById(id);
$("prova").textContent = C.PROVA;
document.title = "Ranking · " + C.PROVA + " · CCTFM";

let anterior = new Map(), primeiraVez = true, ultimosTempos = [], rankingAtual = [];
let aCarregar = false, pendente = false;

async function carregar() {
  if (aCarregar) { pendente = true; return; }
  aCarregar = true;
  try { ultimosTempos = await C.listarTempos(); desenhar(); vivo(true); }
  catch (e) { vivo(false); }
  finally { aCarregar = false; if (pendente) { pendente = false; carregar(); } }
}

function desenhar() {
  const ranking = C.calcularRanking(ultimosTempos);
  const filtro = C.norm($("procura").value || "");
  const lider = ranking.length ? ranking[0].melhor : 0;

  const linhas = ranking.filter(r => !filtro || r.chave.includes(filtro)).map(r => {
    const novo = !primeiraVez && anterior.get(r.chave) !== r.melhor;
    const d = r.melhor - lider;
    const dif = r.pos === 1 ? "—" : "+" + (d < 60000 ? (d / 1000).toFixed(3) : C.fmt(d));
    const cls = [r.pos <= 3 ? "p" + r.pos : "", novo ? "novo" : ""].join(" ");
    return `<tr class="${cls}"><td class="pos"><span>${r.pos}</span></td><td class="nome">${C.esc(r.atleta)}</td>
      <td class="num">${C.fmt(r.melhor)}</td><td class="num dif">${dif}</td><td class="num tent col-tent">${r.tentativas}</td></tr>`;
  });
  $("corpo").innerHTML = linhas.join("");
  $("vazio").hidden = ranking.length > 0;

  anterior = new Map(ranking.map(r => [r.chave, r.melhor]));
  primeiraVez = false;
  rankingAtual = ranking;

  $("hora").textContent = new Date().toLocaleTimeString("pt-PT");
}

function vivo(ok) {
  $("vivo").classList.toggle("off", !ok);
  $("vivoTxt").textContent = ok ? (C.DEMO ? "Modo demo" : "Ao vivo") : "Sem ligação";
}

$("procura").addEventListener("input", desenhar);

// ---------- EM PROVA (tempo real) ----------
let emProva = [], desvio = 0, aCarregarVivo = false, cartoes = [];
const VELHO_MS = 3 * 3600 * 1000; // ignora pistas esquecidas há mais de 3 h

async function sincronizarRelogio() {
  if (C.DEMO) return;
  try {
    const t0 = Date.now();
    const { data, error } = await C.sb.rpc("agora_ms");
    const t1 = Date.now();
    if (!error && data) desvio = Number(data) - (t0 + t1) / 2;
  } catch (e) {}
}
function agoraServidor() { return Date.now() + desvio; }
function decorrido(r) {
  if (r.estado !== "a_correr") return r.decorrido_ms;
  return r.decorrido_ms + Math.max(0, agoraServidor() - Date.parse(r.servidor_em));
}
function posicaoProvisoria(ms) {
  let n = 1;
  for (const r of rankingAtual) { if (r.melhor < ms) n++; else break; }
  return n;
}

async function carregarVivo() {
  if (aCarregarVivo) return;
  aCarregarVivo = true;
  try {
    const rows = await C.listarAoVivo();
    emProva = rows.filter(r => r.estado !== "pronto" && agoraServidor() - Date.parse(r.servidor_em) < VELHO_MS)
               .sort((a, b) => a.pista.localeCompare(b.pista));
    desenharVivo();
  } catch (e) {}
  finally { aCarregarVivo = false; }
}

function desenharVivo() {
  const el = $("aoVivo");
  if (!emProva.length) { el.innerHTML = '<div class="aovivo-vazio">Sem atletas em prova neste momento</div>'; cartoes = []; return; }
  el.innerHTML = emProva.map(r => `
    <div class="vivo-card ${r.estado === "parado" ? "parado" : ""}" data-p="${C.esc(r.pista)}">
      <div class="vc-topo"><span class="rec"></span>PISTA ${C.esc(r.pista)} · ${r.estado === "parado" ? "CHEGADA · A VALIDAR" : "EM PROVA"}</div>
      <div class="vc-nome">${r.atleta ? C.esc(r.atleta) : "—"}</div>
      <div class="vc-tempo">${C.fmt(decorrido(r))}</div>
      <div class="vc-pos"></div>
    </div>`).join("");
  cartoes = [...el.querySelectorAll(".vivo-card")].map((c, i) => ({ r: emProva[i], t: c.querySelector(".vc-tempo"), p: c.querySelector(".vc-pos") }));
  atualizarPosicoes();
}

function atualizarPosicoes() {
  for (const c of cartoes) {
    const ms = decorrido(c.r);
    c.p.innerHTML = rankingAtual.length || c.r.estado === "parado"
      ? `Posição ${c.r.estado === "parado" ? "provável" : "atual"}: <b>${posicaoProvisoria(ms)}.º</b>` : "";
  }
}

(function tickVivo() {
  for (const c of cartoes) if (c.r.estado === "a_correr") c.t.textContent = C.fmt(decorrido(c.r));
  requestAnimationFrame(tickVivo);
})();
setInterval(atualizarPosicoes, 250);

// ---------- Ecrã inteiro ----------
const ICON_ABRIR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
const ICON_FECHAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
const raiz = document.documentElement;
const podeEcra = !!(raiz.requestFullscreen || raiz.webkitRequestFullscreen);
function emEcra() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function atualizarBotao() {
  const on = emEcra();
  document.body.classList.toggle("ecra", on);
  $("btnEcra").innerHTML = on ? ICON_FECHAR : ICON_ABRIR;
  $("btnEcra").title = on ? "Sair do ecrã inteiro" : "Ecrã inteiro";
}
function alternarEcra() {
  try {
    if (emEcra()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else (raiz.requestFullscreen || raiz.webkitRequestFullscreen).call(raiz);
  } catch (e) {}
}
if (podeEcra) {
  $("btnEcra").addEventListener("click", alternarEcra);
  document.addEventListener("fullscreenchange", atualizarBotao);
  document.addEventListener("webkitfullscreenchange", atualizarBotao);
  document.addEventListener("keydown", e => { if ((e.key === "f" || e.key === "F") && document.activeElement !== $("procura")) alternarEcra(); });
  atualizarBotao();
} else {
  $("btnEcra").hidden = true; // ex.: iPhone não suporta ecrã inteiro em páginas web
}

if (C.DEMO) {
  window.addEventListener("storage", e => {
    if (e.key === C.DEMO_KEY) carregar();
    if (e.key === C.DEMO_VIVO) carregarVivo();
  });
  setInterval(carregar, 3000);
  setInterval(carregarVivo, 1500);
} else {
  // Atualização em tempo real + verificação de segurança periódica
  C.sb.channel("crono-" + C.PROVA)
    .on("postgres_changes", { event: "*", schema: "public", table: "tempos" }, () => carregar())
    .on("postgres_changes", { event: "*", schema: "public", table: "ao_vivo" }, () => carregarVivo())
    .subscribe();
  setInterval(carregar, 30000);
  setInterval(carregarVivo, 15000);
  setInterval(sincronizarRelogio, 5 * 60000);
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { carregar(); carregarVivo(); }
});
carregar();
sincronizarRelogio().then(carregarVivo);
</script>
